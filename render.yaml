services:
  - type: web
    name: placement-eligibility
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn placement_system.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: placement-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: placement-db
    plan: free
    region: singapore
