<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign In — PlaceTrack</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'DM Sans',sans-serif;background:#f7faff;color:#10203f;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:500px;background:#fff;border:1px solid #e4ebf4;border-radius:22px;padding:42px;box-shadow:0 20px 70px rgba(37,99,235,.1)}.brand{font:800 28px Syne;margin-bottom:38px}.brand span{color:#2563eb}.title{font:800 38px Syne;margin:0 0 8px}.sub{color:#64748b;margin:0 0 28px;font-size:16px}.error{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;padding:12px;border-radius:10px;margin-bottom:18px}.label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}.input{width:100%;padding:14px 15px;border:1px solid #cbd5e1;border-radius:11px;font-size:15px;outline:none}.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.btn{width:100%;margin-top:24px;padding:15px;border:0;border-radius:11px;background:#2563eb;color:#fff;font:700 15px Syne;cursor:pointer}.signup{text-align:center;color:#64748b;margin:22px 0 4px;font-size:14px}.signup a,.back{color:#2563eb;text-decoration:none;font-weight:700}.back{display:block;text-align:center;margin-top:18px;font-size:14px}
</style></head><body><main class="card"><div class="brand">Place<span>Track</span></div><h1 class="title">Welcome back</h1><p class="sub">Sign in to your PlaceTrack account.</p>{% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}<form method="POST">{% csrf_token %}<label class="label">Username</label><input class="input" type="text" name="username" placeholder="Enter username" required autofocus><label class="label">Password</label><input class="input" type="password" name="password" placeholder="Enter password" required><button class="btn" type="submit">Sign In →</button></form><p class="signup">Don't have an account? <a href="{% url 'signup' %}">Create one</a></p><a class="back" href="{% url 'landing' %}">← Back to project overview</a></main></body></html>
