<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HR Login — PlaceTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'DM Sans',sans-serif;background:#f5f7fb;color:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:460px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:42px;box-shadow:0 18px 60px rgba(15,23,42,.1)}.brand{font:800 26px Syne;margin-bottom:34px}.brand span{color:#2563eb}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700;color:#2563eb}.title{font:800 34px Syne;margin:8px 0}.sub{color:#64748b;margin-bottom:28px}.error{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;padding:12px;border-radius:10px;margin-bottom:18px}.label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}.input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}.btn{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font:700 15px Syne;cursor:pointer}.back{display:block;text-align:center;margin-top:20px;color:#2563eb;text-decoration:none;font-size:14px}
</style></head><body><main class="card"><div class="brand">Place<span>Track</span></div><div class="eyebrow">Secure HR access</div><h1 class="title">Welcome back</h1><p class="sub">Sign in to manage eligibility, companies and shortlists.</p>{% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}<form method="POST">{% csrf_token %}<label class="label">Username</label><input class="input" type="text" name="username" placeholder="Enter username" required autofocus><label class="label">Password</label><input class="input" type="password" name="password" placeholder="Enter password" required><button class="btn" type="submit">Sign In →</button></form><a class="back" href="{% url 'landing' %}">← Back to project overview</a></main></body></html>
